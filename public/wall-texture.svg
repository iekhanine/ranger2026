<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <pattern id="brick" width="180" height="82" patternUnits="userSpaceOnUse">
      <rect width="180" height="82" fill="#8b261b"/>

      <!-- mortar -->
      <path d="M0 0H180 M0 82H180 M0 41H180"
            stroke="#b79a87"
            stroke-width="7"
            opacity=".78"/>

      <path d="M0 0V41 M90 0V41 M180 0V41 M45 41V82 M135 41V82"
            stroke="#b79a87"
            stroke-width="7"
            opacity=".78"/>

      <!-- darker brick edges -->
      <path d="M4 6H86 M94 6H176 M49 47H131"
            stroke="#45110d"
            stroke-width="3"
            opacity=".48"/>

      <!-- brick face variation -->
      <path d="M12 16C32 11 53 20 76 14 M101 24C126 16 143 26 168 18
               M55 58C79 50 103 64 125 55"
            stroke="#bd3d2d"
            stroke-width="5"
            stroke-linecap="round"
            opacity=".45"/>

      <path d="M18 31C34 35 53 28 72 33 M111 13C129 11 150 14 166 10
               M58 72C77 67 96 74 117 69"
            stroke="#e4654d"
            stroke-width="2"
            stroke-linecap="round"
            opacity=".28"/>
    </pattern>

    <filter id="surface-noise" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".62"
        numOctaves="3"
        seed="26"
        stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .13"/>
      </feComponentTransfer>
    </filter>

    <radialGradient id="lighting" cx="50%" cy="42%" r="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".09"/>
      <stop offset="50%" stop-color="#cf3b2b" stop-opacity=".03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity=".46"/>
    </radialGradient>

    <linearGradient id="age" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b130f" stop-opacity=".12"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity=".025"/>
      <stop offset="100%" stop-color="#260705" stop-opacity=".22"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#brick)"/>
  <rect width="1600" height="1000" filter="url(#surface-noise)" opacity=".92"/>
  <rect width="1600" height="1000" fill="url(#age)"/>
  <rect width="1600" height="1000" fill="url(#lighting)"/>

  <!-- old wall stains / scars -->
  <g fill="none" stroke-linecap="round">
    <path d="M72 776C248 708 356 792 506 748"
          stroke="#310907"
          stroke-width="18"
          opacity=".12"/>
    <path d="M1140 214C1260 152 1414 183 1530 280"
          stroke="#d0ae96"
          stroke-width="8"
          opacity=".09"/>
  </g>

  <g fill="#2a0806" opacity=".10">
    <circle cx="130" cy="350" r="9"/>
    <circle cx="159" cy="370" r="5"/>
    <circle cx="1382" cy="620" r="8"/>
    <circle cx="1421" cy="648" r="4"/>
  </g>
</svg>
